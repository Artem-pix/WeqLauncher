name: Build WeqLauncher.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name WeqLauncher --collect-all minecraft_launcher_lib weqlauncher.py

      - uses: actions/upload-artifact@v4
        with:
          name: WeqLauncher-windows
          path: dist/WeqLauncher.exe

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WeqLauncher.exe
